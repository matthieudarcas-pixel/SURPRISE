<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Débloque ton souvenir</title>

    <!-- STYLE DE LA CARTE LEAFLET -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px;
            margin: 0;
        }

        h1 {
            margin-bottom: 40px;
        }

        h2 {
            margin-top: 30px;
        }

        /*
        ==================================================
        BOUTONS DES PERSONNES
        ==================================================
        */

        #people {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            width: 250px;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-sizing: border-box;
            border: 2px solid transparent;
            font-size: 18px;
            font-weight: bold;
        }

        .card:hover {
            transform: scale(1.05);
            background: #334155;
            border-color: #60a5fa;
        }

        .card.debloquee {
            background: #166534;
            border-color: #22c55e;
        }

        /*
        ==================================================
        ÉNIGME ET RÉPONSE
        ==================================================
        */
