<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Débloque ton souvenir</title>

    <!-- Feuille de style Leaflet -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px;
            margin: 0;
        }

        h1 {
            margin-bottom: 40px;
        }

        h2 {
            margin-top: 30px;
        }

        #people {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            display: inline-block;
            width: 250px;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-sizing: border-box;
            border: 2px solid transparent;
            font-size: 18px;
            font-weight: bold;
        }

        .card:hover {
            transform: scale(1.05);
            background: #334155;
            border-color: #60a5fa;
        }

        .card.debloquee {
            background: #166534;
            border-color: #22c55e;
        }

        #zone {
            margin: 40px auto 0;
            max-width: 1000px;
        }

        input {
            padding: 12px;
            width: 300px;
            max-width: 90%;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        video {
            display: block;
            margin: 20px auto 0;
            width: 100%;
            max-width: 900px;
            max-height: 650px;
            background: black;
            border-radius: 15px;
        }

        .reussi {
            color: #22c55e;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
        }

        .erreur {
            color: #ef4444;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
        }

        .information {
            color: #facc15;
            font-weight: bold;
            margin-top: 20px;
        }

        #section-carte {
            max-width: 1100px;
            margin: 60px auto 20px;
        }

        #section-carte p {
            color: #cbd5e1;
        }

        #map {
            width: 100%;
            height: 550px;
            margin-top: 20px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #334155;
            box-sizing: border-box;
            background: #1e293b;
        }

        #message-carte {
            margin-top: 15px;
            color: #facc15;
            font-weight: bold;
        }

        #compteur {
            margin-top: 15px;
            color: #94a3b8;
            font-weight: bold;
        }

        @media screen and (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            h1 {
                font-size: 28px;
            }

            #people {
                gap: 12px;
            }

            .card {
                width: 90%;
            }

            #map {
                height: 420px;
            }
        }

    </style>

</head>

<body>

    <h1>🎬 Débloque ton souvenir</h1>

    <!-- Les boutons des personnes apparaîtront ici -->
    <div id="people"></div>

    <!-- Les énigmes et les vidéos apparaîtront ici -->
    <div id="zone"></div>

    <!-- Carte des souvenirs -->
    <div id="section-carte">

        <h2>🗺️ La carte des souvenirs</h2>

        <p>
            Chaque souvenir débloqué fait apparaître un nouveau point sur la carte.
        </p>

        <div id="map"></div>

        <div id="message-carte">
            Chargement de la carte...
        </div>

        <div id="compteur">
            0 souvenir débloqué
        </div>

    </div>

    <!-- Script JavaScript Leaflet -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        /*
        ==================================================
        DONNÉES DES PERSONNES
        ==================================================

        À modifier pour chaque personne :

        enigme
        reponses
        codePostal

        Le nom indiqué après "video" doit correspondre
        exactement au nom du fichier présent sur GitHub.
        */

        const data = [

            {
                prenom: "Ugo",

                enigme:
                    "Vomi régulier sur une route particulière lors de vos épopées en voiture.",

                reponses: [
                    "banquette arrière",
                    "banquette arriere",
                    "route de jouques"
                ],

                video: "ugo.mp4",

                codePostal: "83560"
            },

            {
                prenom: "Lalou",

                enigme: "A REMPLIR",

                reponses: [
                    "REPONSE1",
                    "REPONSE2"
                ],

                video: "lalou.mp4",

                codePostal: "78646"
            },

            {
                prenom: "Granny",

                enigme: "A REMPLIR",

                reponses: [
                    "REPONSE1",
                    "REPONSE2"
                ],

                video: "granny.mp4",

                codePostal: "83560"
            },

            {
                prenom: "Clotilde et Manu",

                enigme: "A REMPLIR",

                reponses: [
                    "REPONSE1",
                    "REPONSE2"
                ],

                video: "clotildeetmanu.mp4",

                codePostal: "83560"
            },

            {
                prenom: "Granny et Papou",

                enigme: "A REMPLIR",

                reponses: [
                    "REPONSE1",
                    "REPONSE2"
                ],

                video: "granny et papou.mp4",

                codePostal: "83560"
            },

            {
                prenom: "Mamounette",

                enigme: "A REMPLIR",

                reponses: [
                    "REPONSE1",
                    "REPONSE2"
                ],

                video: "mamounette.mp4",

                codePostal: "84095"
            },

            {
                prenom: "Joseph Noia",

                enigme: "A REMPLIR",

                reponses: [
                    "REPONSE1",
                    "REPONSE2"
                ],

                video: "josephnoia.mp4",

                codePostal: "84095"
            }

        ];


        /*
        ==================================================
        VARIABLES
        ==================================================
        */

        let courant = null;

        let map = null;

        let carteDisponible = false;

        const marqueurs = {};

        const souvenirsDebloques = new Set();

        const people = document.getElementById("people");


        /*
        ==================================================
        AFFICHAGE DES BOUTONS DES PERSONNES
        ==================================================

        Les boutons sont créés avant la carte.

        Même si la carte ne fonctionne pas,
        les énigmes et les vidéos restent utilisables.
        */

        data.forEach(function(personne, index) {

            const cartePersonne = document.createElement("div");

            cartePersonne.className = "card";

            cartePersonne.id = "personne-" + index;

            cartePersonne.innerHTML = `
                <span id="cadenas-${index}">🔒</span>
                <span>${personne.prenom}</span>
            `;

            cartePersonne.addEventListener(
                "click",
                function() {
                    ouvrir(index);
                }
            );

            people.appendChild(cartePersonne);

        });


        /*
        ==================================================
        OUVERTURE DE L'ÉNIGME
        ==================================================
        */

        function ouvrir(index) {

            courant = data[index];

            courant.index = index;

            document.getElementById("zone").innerHTML = `

                <h2>${courant.prenom}</h2>

                <p>${courant.enigme}</p>

                <input
                    id="rep"
                    type="text"
                    placeholder="Votre réponse"
                    autocomplete="off"
                >

                <br>

                <button
                    type="button"
                    onclick="verifier()"
                >
                    Valider
                </button>

                <div id="resultat"></div>
            `;

            const champReponse = document.getElementById("rep");

            champReponse.focus();

            champReponse.addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {
                        verifier();
                    }
                }
            );

            document.getElementById("zone").scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }


        /*
        ==================================================
        NORMALISATION DES RÉPONSES
        ==================================================

        Cette fonction ignore :

        Les majuscules
        Les accents
        Les espaces supplémentaires
        */

        function normaliserTexte(texte) {

            return String(texte)
                .trim()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, " ");

        }


        /*
        ==================================================
        VÉRIFICATION DE LA RÉPONSE
        ==================================================
        */

        function verifier() {

            if (!courant) {
                return;
            }

            const champReponse = document.getElementById("rep");

            const resultat = document.getElementById("resultat");

            const reponseUtilisateur = normaliserTexte(
                champReponse.value
            );

            const correcte = courant.reponses.some(
                function(reponseAcceptee) {

                    return normaliserTexte(reponseAcceptee)
                        === reponseUtilisateur;
                }
            );

            if (correcte) {

                const adresseVideo = encodeURI(courant.video);

                resultat.innerHTML = `

                    <p class="reussi">
                        ✅ Bonne réponse !
                    </p>

                    <video
                        controls
                        playsinline
                        preload="metadata"
                    >

                        <source
                            src="${adresseVideo}"
                            type="video/mp4"
                        >

                        Votre navigateur ne supporte pas cette vidéo.

                    </video>

                    <p
                        id="etat-carte"
                        class="information"
                    >
                        📍 Ajout du souvenir sur la carte...
                    </p>
                `;

                debloquerPersonne(courant.index);

                ajouterPointAvecCodePostal(courant);

            } else {

                resultat.innerHTML = `

                    <p class="erreur">
                        ❌ Mauvaise réponse
                    </p>
                `;
            }

        }


        /*
        ==================================================
        DÉBLOCAGE VISUEL DU BOUTON
        ==================================================
        */

        function debloquerPersonne(index) {

            const cartePersonne = document.getElementById(
                "personne-" + index
            );

            const cadenas = document.getElementById(
                "cadenas-" + index
            );

            if (cartePersonne) {

                cartePersonne.classList.add("debloquee");
            }

            if (cadenas) {

                cadenas.textContent = "🔓";
            }

        }


        /*
        ==================================================
        INITIALISATION DE LA CARTE
        ==================================================
        */

        function initialiserCarte() {

            const messageCarte = document.getElementById(
                "message-carte"
            );

            try {

                if (typeof L === "undefined") {

                    carteDisponible = false;

                    messageCarte.textContent =
                        "⚠️ La carte est bloquée par le navigateur, mais les énigmes et les vidéos fonctionnent.";

                    return;
                }

                map = L.map("map").setView(
                    [46.603354, 1.888334],
                    6
                );

                L.tileLayer(
                    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                    {
                        minZoom: 3,

                        maxZoom: 19,

                        attribution:
                            '&copy; OpenStreetMap'
                    }
                ).addTo(map);

                carteDisponible = true;

                messageCarte.textContent =
                    "La carte est prête. Débloque un souvenir pour faire apparaître un point.";

                setTimeout(
                    function() {

                        if (map) {
                            map.invalidateSize();
                        }
                    },
                    300
                );

            } catch (erreur) {

                console.error(
                    "Erreur lors du chargement de la carte :",
                    erreur
                );

                carteDisponible = false;

                messageCarte.textContent =
                    "⚠️ La carte n'a pas pu être chargée, mais les vidéos restent disponibles.";
            }

        }


        /*
        ==================================================
        AJOUT D'UN POINT SELON LE CODE POSTAL
        ==================================================
        */

        async function ajouterPointAvecCodePostal(personne) {

            const etatCarte = document.getElementById(
                "etat-carte"
            );

            if (!carteDisponible || !map) {

                if (etatCarte) {

                    etatCarte.textContent =
                        "⚠️ La vidéo est débloquée, mais la carte n'est pas disponible.";
                }

                return;
            }


            /*
            Si le marqueur existe déjà,
            aucune copie n'est créée.
            */

            if (marqueurs[personne.prenom]) {

                const marqueurExistant =
                    marqueurs[personne.prenom];

                map.setView(
                    marqueurExistant.getLatLng(),
                    11
                );

                marqueurExistant.openPopup();

                if (etatCarte) {

                    etatCarte.textContent =
                        "📍 Ce souvenir est déjà présent sur la carte.";
                }

                faireDefilerVersCarte();

                return;
            }


            const codePostal = String(
                personne.codePostal
            ).trim();


            /*
            Vérification du code postal.
            */

            if (
                !/^\d{5}$/.test(codePostal) ||
                codePostal === "00000"
            ) {

                if (etatCarte) {

                    etatCarte.textContent =
                        "⚠️ La vidéo est débloquée, mais aucun code postal valide n'a été renseigné.";
                }

                return;
            }


            try {

                if (etatCarte) {

                    etatCarte.textContent =
                        "📍 Recherche du code postal " +
                        codePostal +
                        "...";
                }


                const adresseAPI =
                    "https://geo.api.gouv.fr/communes" +
                    "?codePostal=" +
                    encodeURIComponent(codePostal) +
                    "&fields=nom,centre,codesPostaux" +
                    "&format=json" +
                    "&geometry=centre";


                const reponse = await fetch(adresseAPI);


                if (!reponse.ok) {

                    throw new Error(
                        "Le service géographique n'a pas répondu correctement."
                    );
                }


                const communes = await reponse.json();


                if (
                    !Array.isArray(communes) ||
                    communes.length === 0
                ) {

                    throw new Error(
                        "Aucune commune trouvée pour ce code postal."
                    );
                }


                const commune = communes[0];


                if (
                    !commune.centre ||
                    !Array.isArray(commune.centre.coordinates)
                ) {

                    throw new Error(
                        "Aucune coordonnée trouvée."
                    );
                }


                /*
                Les coordonnées sont reçues dans cet ordre :

                longitude
                latitude
                */

                const longitude =
                    commune.centre.coordinates[0];

                const latitude =
                    commune.centre.coordinates[1];

                const nomCommune =
                    commune.nom;


                const marqueur = L.marker(
                    [latitude, longitude]
                ).addTo(map);


                marqueur.bindPopup(`

                    <div
                        style="
                            text-align:center;
                            color:#111827;
                        "
                    >

                        <strong>
                            🎬 ${personne.prenom}
                        </strong>

                        <br>

                        ${nomCommune}

                        <br>

                        Code postal : ${codePostal}

                    </div>
                `);


                marqueurs[personne.prenom] = marqueur;

                souvenirsDebloques.add(personne.prenom);

                mettreAJourCompteur();


                map.setView(
                    [latitude, longitude],
                    11
                );


                setTimeout(
                    function() {

                        map.invalidateSize();

                        marqueur.openPopup();
                    },
                    200
                );


                if (etatCarte) {

                    etatCarte.textContent =
                        "📍 Point ajouté sur la carte : " +
                        nomCommune +
                        ".";
                }


                faireDefilerVersCarte();

            } catch (erreur) {

                console.error(
                    "Erreur de géolocalisation :",
                    erreur
                );

                if (etatCarte) {

                    etatCarte.textContent =
                        "⚠️ La vidéo est débloquée, mais le code postal n'a pas pu être placé sur la carte.";
                }
            }

        }


        /*
        ==================================================
        DÉFILEMENT VERS LA CARTE
        ==================================================
        */

        function faireDefilerVersCarte() {

            setTimeout(
                function() {

                    document
                        .getElementById("section-carte")
                        .scrollIntoView({
                            behavior: "smooth",
                            block: "start"
                        });
                },
                500
            );

        }


        /*
        ==================================================
        COMPTEUR
        ==================================================
        */

        function mettreAJourCompteur() {

            const nombre = souvenirsDebloques.size;

            let texte;

            if (nombre === 0) {

                texte = "0 souvenir débloqué";

            } else if (nombre === 1) {

                texte = "1 souvenir débloqué";

            } else {

                texte =
                    nombre +
                    " souvenirs débloqués";
            }

            document.getElementById(
                "compteur"
            ).textContent = texte;

        }


        /*
        ==================================================
        DÉMARRAGE DE LA CARTE
        ==================================================
        */

        initialiserCarte();

    </script>

</body>

</html>
